name: ContrastBench
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ContrastBench:
    type: application
    platform: iOS
    sources: [App, Sources/ContrastCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talk2rakesh.contrastbench
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ContrastBenchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ContrastBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talk2rakesh.contrastbench.uitests
schemes:
  ContrastBench:
    build:
      targets:
        ContrastBench: all
    test:
      targets: [ContrastBenchUITests]
