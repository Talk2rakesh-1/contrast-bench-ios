name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test
      - run: xcrun swift-format lint --strict -r App Sources Tests UITests Package.swift
      - name: Build and analyze
        run: xcodebuild -project ContrastBench.xcodeproj -scheme ContrastBench -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build analyze
      - name: Select available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: UI smoke test
        run: xcodebuild -project ContrastBench.xcodeproj -scheme ContrastBench -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-test-results
          path: TestResults.xcresult
